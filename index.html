<!DOCTYPE html>
<html>

<head>
  <title>Weather App</title>
  <link rel="stylesheet" href="style/reset.css" />
  <link rel="stylesheet" href="style/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <main>
    <section class="panel">
      <h1 class="panel-title">
        <span>En ce moment à <span id="weather-location-name"></span></span>
        <span class="panel-detail">(<span id="current-time">...</span>)</span>
      </h1>
      <div id="current-weather" class="panel-content">
        <div id="current-interpretation" class="current-interpretation"></div>
        <div id="current-details" class="details"></div>
      </div>
    </section>
    <section class="panel">
      <h1 class="panel-title">Par heure</h1>
      <div id="hourly-container" class="scrollable-h"></div>
    </section>
    <section class="panel">
      <h1 class="panel-title">Par jours</h1>
      <div id="daily-container" class="scrollable-h"></div>
    </section>

    <form id="change-city-form" class="change-city-form">
      <label for="city-input">Changer la ville :</label>
      <input id="city-input" type="text" name="city" placeholder="Angers" />
      <ul id="suggestions-list" class="suggestions-list"></ul>
    </form>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
